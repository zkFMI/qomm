[project]
name = "qomm"
version = "0.1.0"
description = "Oblivious market making: quote without disclosing the request, the pricing rule, or the market."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    "pynacl>=1.5",
    "matplotlib>=3.10",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "zkpi @ git+https://github.com/shukob/zkpi",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qomm_sim", "qomm_dsl", "qomm_audit", "qomm_transport", "qomm_demo", "qomm_identity", "mp_spdz", "zk", "scripts"]
