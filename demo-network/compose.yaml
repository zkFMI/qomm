      - --cash
      - "0"
      - --inventory
      - "0"
      - --defmi-endpoint
      - http://defmi-network:9650/rpc
    volumes:
      - mpc-operator-6-state:/var/lib/qomm-participant

  gateway:
    image: qomm-demo-app:local
    build:
      <<: *app-build
      target: app-runtime
    restart: unless-stopped
    environment:
      # Audit journal of every DeFMI transition the gateway issues (method and
      # params, verbatim); the acceptance run re-presents an accepted
      # allocation from it to show the L1 refuses a second application.
      QOMM_DEFMI_JOURNAL_DIR: /home/qomm/defmi-journal
      QOMM_ASSURANCE_STATE: /home/qomm/control/assurance.json
      ZKPI_ASSURANCE_MODE: ${ZKPI_ASSURANCE_MODE:-joint_proof}
      ZKPI_OPTIMISTIC_POLICY_ID: ${ZKPI_OPTIMISTIC_POLICY_ID:-}
      ZKPI_OPTIMISTIC_PROPOSER_PARTY: ${ZKPI_OPTIMISTIC_PROPOSER_PARTY:-1}
      QOMM_PUBLIC_DEVELOPMENT_CHALLENGE: ${QOMM_PUBLIC_DEVELOPMENT_CHALLENGE:-0}
    volumes:
      - gateway-control:/home/qomm/control
    command:
      - qomm-demo
      - --host
      - 0.0.0.0
      - --port
      - "8801"
      - --makers
      - "4"
      - --nodes
      - "7"
      - --threshold
      - "2"
      # The gateway defaults to the in-process `sim` engine; the demo network
      # runs the seven MPC services, so the distributed engine is selected
      # explicitly.
      - --engine
      - distributed
      - --mpc-endpoints
      - http://mpc-0:9100,http://mpc-1:9100,http://mpc-2:9100,http://mpc-3:9100,http://mpc-4:9100,http://mpc-5:9100,http://mpc-6:9100
      - --defmi-endpoint
      - http://defmi-network:9650/rpc
      - --maker-endpoints
      - http://maker-0:9200,http://maker-1:9200,http://maker-2:9200,http://maker-3:9200
      - --taker-endpoint
      - http://taker:9200
      - --mpc-operator-endpoints
      - http://mpc-operator-0:9200,http://mpc-operator-1:9200,http://mpc-operator-2:9200,http://mpc-operator-3:9200,http://mpc-operator-4:9200,http://mpc-operator-5:9200,http://mpc-operator-6:9200
      - --round-seconds
      - "15"
      - --step-ms
      - "450"
      # The public acceptance demo is operator-driven. Background bot rounds
      # would mutate DeFMI while an outage/replay test is measuring that the
      # corporate queue causes exactly one canonical transition.
      - --no-auto-rounds
    expose:
      - "8801"
    networks:
      - qomm-demo
    depends_on:
      defmi-network:
        condition: service_healthy
      mpc-0: {condition: service_healthy}
      mpc-1: {condition: service_healthy}
      mpc-2: {condition: service_healthy}
      mpc-3: {condition: service_healthy}
      mpc-4: {condition: service_healthy}
      mpc-5: {condition: service_healthy}
      mpc-6: {condition: service_healthy}
      maker-0: {condition: service_healthy}
      maker-1: {condition: service_healthy}
      maker-2: {condition: service_healthy}
      maker-3: {condition: service_healthy}
      taker: {condition: service_healthy}
      mpc-operator-0: {condition: service_healthy}
      mpc-operator-1: {condition: service_healthy}
      mpc-operator-2: {condition: service_healthy}
      mpc-operator-3: {condition: service_healthy}
      mpc-operator-4: {condition: service_healthy}
      mpc-operator-5: {condition: service_healthy}
      mpc-operator-6: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8801/"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    image: qomm-demo-app:local
    # Same image as the participants and the gateway; declared here too so
    # `docker compose build frontend` rebuilds the UI instead of doing nothing.
    build:
      <<: *app-build
      target: app-runtime
    restart: unless-stopped
    command:
      - qomm-frontend
      - --host
      - 0.0.0.0
      - --port
      - "8800"
      - --gateway-host
      - gateway
      - --gateway-port
      # The Rust frontend proxies /ws inside this Compose network. Browsers use
      # the same public 8800 origin as the static UI, so a second exposed port
      # cannot accidentally resolve to another local or remote QOMM gateway.
      - "8801"
    ports:
      - "8800:8800"
    networks:
      - qomm-demo
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8800/health"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  qomm-demo:
    # Keep each Compose deployment isolated.  A fixed engine-level name made
    # two concurrently running demo projects share DNS aliases such as
    # `maker-0`; requests could then reach a participant from the other legal
    # venue and invalidate its signed KYB cohort.
    driver: bridge
    internal: false

volumes:
  gateway-control:
  defmi-state:
  mpc-0-state:
  mpc-1-state:
  mpc-2-state:
  mpc-3-state:
  mpc-4-state:
  mpc-5-state:
  mpc-6-state:
  maker-0-state:
  maker-1-state:
  maker-2-state:
  maker-3-state:
  taker-state:
  mpc-operator-0-state:
  mpc-operator-1-state:
  mpc-operator-2-state:
  mpc-operator-3-state:
  mpc-operator-4-state:
  mpc-operator-5-state:
  mpc-operator-6-state:
