name: qomm-demo-network

x-build: &app-build
  # The build context is the qomm repository root; the image clones the
  # pinned zkFMI/defmi and zkFMI/zkpi revisions itself (see Dockerfile).
  context: ..
  dockerfile: demo-network/Dockerfile
  # The images only use the host network while fetching pinned build inputs.
  # Runtime services still communicate exclusively on the qomm-demo bridge.
  network: host

x-mpc-common: &mpc-common
  image: qomm-demo-mpc:local
  environment:
    QOMM_RECIPIENT_PARTICIPANTS: http://maker-0:9200,http://maker-1:9200,http://maker-2:9200,http://maker-3:9200,http://taker:9200
  depends_on:
    maker-0: {condition: service_healthy}
    maker-1: {condition: service_healthy}
    maker-2: {condition: service_healthy}
    maker-3: {condition: service_healthy}
    taker: {condition: service_healthy}
  restart: unless-stopped
  expose:
    - "5000"
    - "9100"
  networks:
    - qomm-demo
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9100/health"]
    interval: 5s
    timeout: 3s
    retries: 60
    start_period: 180s

x-participant-common: &participant-common
  image: qomm-demo-app:local
  restart: unless-stopped
  expose:
    - "9200"
  networks:
    - qomm-demo
  depends_on:
    defmi-network:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9200/health"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  defmi-network:
    image: qomm-demo-defmi:local
    build:
      <<: *app-build
      target: defmi-runtime
    restart: unless-stopped
    command:
      - --runner
      - /usr/local/bin/avalanche-network-runner
      - --avalanchego
      - /usr/local/bin/avalanchego
      - --vm
      - /usr/local/bin/qomm-avalanche-vm
      - --genesis-config
      - /etc/qomm-defmi/genesis.json
      - --state-root
      - /var/lib/qomm-defmi
      - --runner-port
      - "18080"
      - --runner-gateway-port
      - "18081"
      - --proxy-host
      - 0.0.0.0
      - --proxy-port
      - "9650"
    ports:
      - "9650:9650"
    volumes:
      - defmi-state:/var/lib/qomm-defmi
    networks:
      - qomm-demo
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9650/health"]
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 120s

  mpc-0:
    <<: *mpc-common
    build:
      <<: *app-build
      target: mpc-runtime
    command: &mpc-command
      - qomm-mpc-node
      - --node
      - "0"
      - --api-port
      - "9100"
      - --listen-host
      - 0.0.0.0
      - --mp-spdz-root
      - /opt/MP-SPDZ
      - --state-root
      - /var/lib/qomm-mpc
      - --makers
      - "4"
      - --references
      - 15750,10850,6420000
      - --bit-length
      - "63"
      - --party-hosts
      - mpc-0:5000,mpc-1:5000,mpc-2:5000,mpc-3:5000,mpc-4:5000,mpc-5:5000,mpc-6:5000
    volumes:
      - mpc-0-state:/var/lib/qomm-mpc

  mpc-1:
