[workspace]
resolver = "2"
members = ["qomm-law","qomm-demo","qomm-harness","qomm-proofs","qomm-transport"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "8675b6d7d65f2437963de7184149af3c56d92d45" }
deccp-core = { git = "https://github.com/zkFMI/deccp.git", rev = "c64c16c25e6398740a52ba0e81505e1869db569f" }
dekyx-core = { git = "https://github.com/zkFMI/dekyx.git", rev = "9518393a58be731fe25147e77d22926062fca33a" }
defmi-avalanche-vm = { git = "https://github.com/zkFMI/defmi.git", rev = "15243a7d70169f0c83382139b2db5e2778d51258" }
# Audited by Quarkslab (2019, commissioned by Tari Labs, 30 man-days) together
# with subtle and bulletproofs. 4.1.3 is the first release carrying the fix for
# RUSTSEC-2024-0344, a timing leak LLVM introduced into Scalar::sub, so the
# floor is not negotiable.
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
bulletproofs = "5.0"
merlin = "3"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.5"
# Threshold Schnorr from the Zcash Foundation, partially audited by NCC Group
# (2023, v0.6.0). Replaces a hand-rolled threshold sigma protocol.
frost-ristretto255 = "3.0"
frost-core = "3.0"
# Ed25519 signatures for the KYB issuer. Same dalek assessment as the group.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
hex = "0.4"
thiserror = "1"
rand = "0.8"
regex = "1.13.1"
openssl = { version = "=0.10.81", features = ["vendored"] }
libc = "0.2"
zkfmi-zk = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkpi = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkpi-proofs = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
defmi = { git = "https://github.com/zkFMI/defmi.git", rev = "15243a7d70169f0c83382139b2db5e2778d51258" }
qomm-dsl = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
qomm-law = { path = "qomm-law" }
qomm-proofs = { path = "qomm-proofs" }
qomm-transport = { path = "qomm-transport" }
qomm-sim = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkfmi-measure = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
qomm-mpc = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkpi-committee = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }
zkpi-defmi-sdk = { git = "https://github.com/zkFMI/defmi.git", rev = "15243a7d70169f0c83382139b2db5e2778d51258" }
qomm-audit = { git = "https://github.com/zkFMI/zkpi.git", rev = "fc9579070484859aff9110a927be79c1ffe22b70" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/zkFMI/qomm.git"]
qomm-law = { path = "qomm-law" }
